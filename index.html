<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PilatesGo</title>
  <meta name="description" content="PilatesGo: eğitmenler ve öğrenciler için pilates, beslenme ve canlı ders uygulaması.">
  <style>
    :root { --zemin:#0E1824; --yuzey:#16233A; --metin:#EAF0F7; --ikincil:#9AA8BC; --vurgu:#C6F432; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--zemin); color:var(--metin); padding:24px 16px;
           font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { width:100%; max-width:520px; background:var(--yuzey); border-radius:24px; padding:32px 24px; }
    h1 { margin:0 0 4px; font-size:34px; letter-spacing:-0.5px; }
    h1 span { color:var(--vurgu); }
    p { color:var(--ikincil); line-height:1.6; margin:8px 0 0; }
    .ayrac { height:1px; background:#24344F; margin:24px 0; }
    a { display:block; color:var(--zemin); background:var(--vurgu); text-decoration:none;
        font-weight:700; text-align:center; padding:14px; border-radius:14px; margin-top:12px; }
    a.ikincil { background:transparent; color:var(--metin); border:1px solid #24344F; }
    small { display:block; color:var(--ikincil); margin-top:24px; text-align:center; }
  </style>
</head>
<body>
  <main>
    <h1>Pilates<span>Go</span></h1>
    <p>Eğitmenler ve öğrencileri için pilates programları, beslenme takibi ve canlı dersler.</p>
    <p lang="en">Pilates programs, nutrition tracking and live classes for trainers and their students.</p>

    <div class="ayrac"></div>

    <a class="ikincil" href="mailto:genc.sem01@gmail.com">İletişim · Contact</a>

    <small>© GencS</small>
  </main>
</body>
</html>
